<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ysjf-player-enhancer</title>
  <style>
    body {
      width: 240px;
      padding: 20px;
      margin: 0;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #ffffff;
    }
    .test-text {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .switch-label {
      font-size: 14px;
      color: #333;
    }
    /* Switch 样式 */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    /* 关注作者按钮：B站品牌色 */
    .follow-btn {
      display: block;
      margin: 16px auto 0;
      padding: 10px 20px;
      background: #fb7299; /* B 站粉色 */
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(251, 114, 153, 0.3);
      transition: background 0.15s, transform 0.1s;
    }
    .follow-btn:hover {
      background: #fc8caf;
    }
    .follow-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="test-text">ysjf-player-enhancer</div>

  <div class="switch-row">
    <span class="switch-label">上下切换按钮</span>
    <label class="switch">
      <input type="checkbox" id="enhancerSwitch">
      <span class="slider"></span>
    </label>
  </div>

  <div class="switch-row">
    <span class="switch-label">自动播放</span>
    <label class="switch">
      <input type="checkbox" id="autoplaySwitch">
      <span class="slider"></span>
    </label>
  </div>

  <a href="https://space.bilibili.com/521041866" target="_blank" rel="noopener noreferrer" class="follow-btn">
    👉 关注作者（B站）
  </a>

  <script src="popup.js"></script>
</body>
</html>
